<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <title>Zoolama</title>
    <script>
      // Apply the saved theme before first paint (no light flash). Key must match src/store.js.
      try {
        var theme = JSON.parse(localStorage.getItem('zoolama:v1')).theme;
        if (theme) document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Zoolama" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preload" href="./fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./src/app.js"></script>
  </head>
  <body>
    <header class="bar">
      <h1 class="brand">Zoolama</h1>
      <div class="bar-tools">
        <button type="button" id="theme" class="theme-btn">
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" /></svg>
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        </button>
        <div class="lang" role="group" data-i18n-aria-label="langLabel">
          <button type="button" data-lang="pt" aria-pressed="true">PT</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <main>
      <section id="panel-cart" class="panel" role="tabpanel" aria-labelledby="tab-cart">
        <form id="entry" class="entry" novalidate autocomplete="off">
          <div class="entry-price">
            <label for="price" data-i18n="price">Preço</label>
            <div class="money-field">
              <span aria-hidden="true">R$</span>
              <input id="price" inputmode="decimal" enterkeyhint="done" placeholder="0,00" aria-describedby="price-error" />
            </div>
            <p id="price-error" class="field-error" aria-live="polite"></p>
          </div>
          <div class="entry-qty">
            <label for="qty" data-i18n="qty">Qtd</label>
            <div class="stepper">
              <button type="button" data-step="-1" data-i18n-aria-label="oneLess">−</button>
              <input id="qty" inputmode="numeric" value="1" />
              <button type="button" data-step="1" data-i18n-aria-label="oneMore">+</button>
            </div>
          </div>
          <input id="name" class="entry-name" enterkeyhint="done" data-i18n-placeholder="name" data-i18n-aria-label="name" />
          <button class="primary" type="submit" data-i18n="add">Adicionar</button>
        </form>
        <p id="empty" class="empty" data-i18n="emptyCart"></p>
        <ul id="lines" class="lines"></ul>
      </section>

      <section id="panel-compare" class="panel" role="tabpanel" aria-labelledby="tab-compare" hidden>
        <ol id="options" class="options"></ol>
        <p id="compare-msg" class="compare-msg" aria-live="polite"></p>
        <div class="compare-actions">
          <button type="button" id="add-option" class="secondary" data-i18n="addOption">+ Opção</button>
          <button type="button" id="reset-compare" class="secondary" data-i18n="reset">Recomeçar</button>
        </div>
      </section>
    </main>

    <div class="dock">
      <div id="toast" class="toast" role="status" hidden>
        <span id="toast-text"></span>
        <button type="button" id="toast-undo" data-i18n="undo" hidden>Desfazer</button>
      </div>
      <footer class="tally">
        <div class="tally-tag">
          <span class="tally-label" data-i18n="total">Total</span>
          <output id="total" class="tag-price" aria-live="polite"></output>
        </div>
        <div class="tally-meta">
          <span id="count"></span>
          <button type="button" id="clear" class="on-tag" data-i18n="clear">Limpar</button>
        </div>
      </footer>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-cart" aria-controls="panel-cart" data-tab="cart">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M2.5 3.5h2.3l2.4 10.7a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.2l1.7-6.8H5.8" />
              <path d="M10 10.5h6" />
              <circle cx="9.5" cy="19.5" r="1.4" />
              <circle cx="17" cy="19.5" r="1.4" />
            </svg>
          </span>
          <span data-i18n="tabCart">Carrinho</span>
        </button>
        <button type="button" role="tab" id="tab-compare" aria-controls="panel-compare" data-tab="compare">
          <span class="tab-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path d="M12 4.5V20M8 20h8M4.5 8.6l15-2.6" />
              <circle cx="12" cy="3.8" r="1.2" />
              <path d="M4.5 8.6 2 14.6M4.5 8.6l2.5 6M2 14.6a2.5 2.5 0 0 0 5 0Z" />
              <path d="M19.5 6 17 12M19.5 6l2.5 6M17 12a2.5 2.5 0 0 0 5 0Z" />
            </svg>
          </span>
          <span data-i18n="tabCompare">Comparar</span>
        </button>
      </nav>
    </div>
  </body>
</html>
